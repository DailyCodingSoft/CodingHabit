name: Delete branch on pr closed

on:
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  delete-branch:
    name: Delete branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "Deleting branch: ${{ github.head_ref }}"
          git branch -D ${{ github.head_ref }}
          echo "Branch deleted: ${{ github.head_ref }}"

